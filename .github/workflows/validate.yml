name: Documentation validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate JSON examples
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path(".").rglob("*.json"):
              if ".git" in path.parts:
                  continue
              json.loads(path.read_text())
              print(f"valid JSON: {path}")
          PY

      - name: Check required portfolio files
        run: |
          set -euo pipefail

          required_files=(
            "README.md"
            "ARCHITECTURE.md"
            "SECURITY.md"
            "RUNBOOKS/TROUBLESHOOTING.md"
            "diagrams/mermaid-diagram.png"
            "docs/README.md"
            "docs/decisions/ADR-001-network-segmentation.md"
            "docs/decisions/ADR-002-reverse-proxy.md"
            "docs/decisions/ADR-003-private-remote-access-and-public-tls.md"
            "docs/decisions/ADR-004-ai-inference.md"
            "services/ai/README.md"
            "services/ai/docker-compose.example.yml"
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "::error::Missing required portfolio file: $file"
              exit 1
            }
            echo "found: $file"
          done
